# LightDM mensyaratkan user yang di-autologin berada di grup 'autologin'.
# Lihat /etc/pam.d/lightdm-autologin:
#   auth  [success=1 default=ignore]  pam_succeed_if.so user ingroup autologin
# Tanpa keanggotaan ini, autologin jatuh ke pam_unix.so yang butuh password
# (tidak ada pada liveuser) sehingga sesi XFCE tidak pernah dimulai dan
# LightDM hanya menampilkan greeter.
#
# Grup 'autologin' tidak dibuat oleh paket lightdm (lihat
# /usr/lib/sysusers.d/lightdm.conf), jadi harus dideklarasikan di sini.
# Grup 'liveuser' juga belum ada di /etc/group walau /etc/passwd memakai
# GID 1000 sebagai primary group-nya.
g liveuser 1000
g autologin -
m liveuser autologin

[LightDM]
# greeter-user adalah opsi level server, bukan opsi seat. Jika diletakkan
# di [Seat:*] LightDM akan mengabaikannya ("contains unknown option").
greeter-user=lightdm

[Seat:*]
autologin-user=liveuser
# LightDM mencari user autologin lewat accounts-daemon. Kalau user belum
# terdaftar saat seat aktif, LightDM menunggu sampai timeout ini habis,
# lalu greeter mengambil alih seat (dan live medium tampil dialog login
# tanpa bisa masuk, karena liveuser tidak punya password). 30 detik
# memberi ruang untuk mesin lambat.
autologin-user-timeout=30
autologin-session=xfce
user-session=xfce
greeter-session=lightdm-gtk-greeter

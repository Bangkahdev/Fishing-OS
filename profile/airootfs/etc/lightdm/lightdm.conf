[LightDM]
# greeter-user adalah opsi level server, bukan opsi seat. Jika diletakkan
# di [Seat:*] LightDM akan mengabaikannya ("contains unknown option").
greeter-user=lightdm

[Seat:*]
autologin-user=liveuser
# LightDM baru mencoba autologin setelah X server siap (11-15 detik pada
# live medium) dan daftar user dari accounts-daemon diterima. Timeout 5
# detik kalah dari boot lambat: LightDM menyerah, greeter mengambil alih
# seat, dan live medium tampil layar hitam tanpa bisa masuk (liveuser tidak
# punya password). 30 detik memberi ruang untuk mesin lambat.
autologin-user-timeout=30
autologin-session=xfce
user-session=xfce
greeter-session=lightdm-gtk-greeter

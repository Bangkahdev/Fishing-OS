[Unit]
# LightDM mencari user autologin lewat accounts-daemon (D-Bus). Paket
# lightdm hanya menunggu systemd-user-sessions.service, sehingga LightDM
# bisa mengaktifkan seat SEBELUM accounts-daemon mendaftarkan 'liveuser'.
# Akibatnya LightDM tidak menemukan user, jatuh ke greeter, dan live
# medium menampilkan dialog login (liveuser tidak punya password) alih-alih
# desktop..lightdm 1.33.1 juga hanya memberi waktu
# 'autologin-user-timeout' yang bisa habis sebelum accounts-daemon siap.
#
# Tunggu accounts-daemon (daftar user) dan systemd-sysusers (grup
# 'autologin' yang disyaratkan pam_succeed_if.so user ingroup autologin)
# selesai lebih dulu.
After=accounts-daemon.service systemd-sysusers.service
Wants=accounts-daemon.service systemd-sysusers.service

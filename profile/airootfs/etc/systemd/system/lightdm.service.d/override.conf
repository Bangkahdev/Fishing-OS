[Unit]
# Syarat autologin LiveDM ada di /etc/pam.d/lightdm-autologin:
#   pam_succeed_if.so user ingroup autologin
# Grup 'autologin' dibuat oleh systemd-sysusers.service. Pastikan unit itu
# selesai lebih dulu, kalau tidak PAM bisa menolak sebelum keanggotaan
# grup terbentuk dan LightDM jatuh ke greeter.
After=systemd-sysusers.service
Wants=systemd-sysusers.service

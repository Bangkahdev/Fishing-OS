[Unit]
# Tunggu accounts-daemon (daftar user) dan systemd-sysusers (grup
# 'autologin' yang disyaratkan pam_succeed_if.so user ingroup autologin)
# selesai lebih dulu, lalu berikan jeda singkat agar D-Bus siap.
After=accounts-daemon.service systemd-sysusers.service
Wants=accounts-daemon.service systemd-sysusers.service

[Service]
ExecStartPre=/usr/bin/bash -c 'for i in {1..30}; do if getent passwd liveuser >/dev/null 2>&1; then break; fi; sleep 0.1; done'

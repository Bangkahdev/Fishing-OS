[Unit]
ConditionKernelCommandLine=!mirror
# Jangan bergantung pada network-online.target: menunggu "jaringan online"
# bisa memakan menit dan membuat unit ini gagal karena timeout job.
# network.target hanya mengurutkan, tidak menahan boot.
After=network.target

[Service]
# Live ISO tidak boleh menunggu refresh mirror lebih lama dari ini.
# Tanpa batas, unduh daftar mirror bisa menggantung >10 menit dan
# menahan target Multi-User/Graphical (boot pun ikut molor).
TimeoutStartSec=30
# Jangan ulangi: retry hanya memperpanjang waktu tunggu boot.
Restart=no

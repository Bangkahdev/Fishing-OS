LABEL fishing64
TEXT HELP
Boot the Fishing OS live medium on BIOS.
It allows you to use Fishing OS as a live system for development and DevOps.
ENDTEXT
MENU LABEL Fishing OS live medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Fishing OS live medium on BIOS with speakup screen reader.
It allows you to use Fishing OS as a live system with speech feedback.
ENDTEXT
MENU LABEL Fishing OS live medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on

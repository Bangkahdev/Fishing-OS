LABEL fishing_nbd
TEXT HELP
Boot the Fishing OS live medium using NBD.
It allows you to use Fishing OS as a live system for development and DevOps.
ENDTEXT
MENU LABEL Fishing OS live medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3


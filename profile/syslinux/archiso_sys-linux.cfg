LABEL fishing
TEXT HELP
Boot the Fishing OS live medium on BIOS.
It allows you to use Fishing OS as a live system for development and DevOps.
ENDTEXT
MENU LABEL Fishing OS live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Jalur kedua: pasang sistem ke disk, bukan memakai LiveOS.
LABEL fishinginstall
TEXT HELP
Boot the live system, then open the Fishing OS installer automatically.
Pilih disk tujuan dengan hati-hati: data di disk tersebut bisa terhapus.
ENDTEXT
MENU LABEL Fishing OS ^installer to disk (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% fishing.install=1

# Accessibility boot option
LABEL fishingspeech
TEXT HELP
Boot the Fishing OS live medium on BIOS with speakup screen reader.
It allows you to use Fishing OS as a live system with speech feedback.
ENDTEXT
MENU LABEL Fishing OS live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on

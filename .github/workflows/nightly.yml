name: Nightly Build Fishing OS

on:
  schedule:
    - cron: '0 0 * * 0'  # Minggu jam 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archiso qemu-base expect git dosfstools mtools \
            squashfs-tools gnupg

      - name: Build ISO
        run: |
          mkarchiso -v -w work -o out profile
          ISO_PATH="$(ls out/*.iso | head -n1)"
          ISO_SIZE="$(stat -c%s "$ISO_PATH")"
          MAX_SIZE=$((4700 * 1024 * 1024))  # 4.7 GiB
          echo "ISO_PATH=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "ISO_SIZE=$ISO_SIZE" >> "$GITHUB_OUTPUT"
          if [[ "$ISO_SIZE" -gt "$MAX_SIZE" ]]; then
            echo "ERROR: ISO size $ISO_SIZE bytes exceeds 4.7 GiB limit" >&2
            exit 1
          fi
          ls -lh out/

      - name: Generate checksums
        run: |
          cd out
          sha256sum fishing-os*.iso > sha256sums.txt
          cat sha256sums.txt

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fishing-os-nightly
          path: |
            out/*.iso
            out/sha256sums.txt
          retention-days: 7

  report:
    needs: build
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Open issue on build failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed: ${new Date().toISOString()}`,
              body: `Nightly ISO build failed.\n\nRun: ${runUrl}\n\nPlease check the build logs and fix any issues with package availability or ISO build process.\n\n---\nAuto-generated by nightly workflow.`,
              labels: ['ci', 'nightly', 'bug']
            });

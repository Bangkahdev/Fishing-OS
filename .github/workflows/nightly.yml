---
name: Nightly Build Fishing OS

on:
  schedule:
    - cron: '0 0 * * 0'  # Minggu jam 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 7

  report:
    needs: build
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Open issue on build failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}` +
              `/${process.env.GITHUB_REPOSITORY}/actions/runs/` +
              `${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed: ${new Date().toISOString()}`,
              body: `Nightly ISO build atau smoke test gagal.\n\nRun: ${runUrl}\n` +
                `Periksa log build; penyebab umum: paket hilang atau berganti ` +
                `nama di repositori Arch.\n\n---\nAuto-generated by nightly workflow.`,
              labels: ['ci', 'nightly', 'bug']
            });

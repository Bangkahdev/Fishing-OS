---
name: Build (reusable)

on:
  workflow_call:
    inputs:
      retention-days:
        description: Lama penyimpanan artefak ISO (hari)
        type: number
        default: 14
    outputs:
      iso-version:
        description: Versi ISO yang dibangun
        value: ${{ jobs.build.outputs.iso-version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    defaults:
      run:
        shell: bash
    outputs:
      iso-version: ${{ steps.version.outputs.iso-version }}

    steps:
      - name: Install git (dibutuhkan checkout)
        run: pacman -Syu --noconfirm git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pacman -Syu --noconfirm archiso git

      - name: Determine ISO version and SOURCE_DATE_EPOCH
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SDE="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ct HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]{4})\.([0-9]{2})\.([0-9]+)$ ]]; then
              ISO_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            else
              echo "::error::Tag '$GITHUB_REF_NAME' tidak cocok dengan format vAAAA.BB.N"
              exit 1
            fi
          else
            ISO_VERSION="$(date -u -d "@$SDE" +%Y.%m.%d)"
          fi
          echo "source-date-epoch=$SDE" >> "$GITHUB_OUTPUT"
          echo "iso-version=$ISO_VERSION" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$SDE, ISO_VERSION=$ISO_VERSION"

      - name: Stamp os-release with ISO version
        env:
          FISHING_ISO_VERSION: ${{ steps.version.outputs.iso-version }}
        run: |
          sed -i -E \
            "s/^(VERSION|VERSION_ID|BUILD_ID)=.*/\1=\"${FISHING_ISO_VERSION}\"/" \
            profile/airootfs/etc/os-release
          grep -E '^(VERSION|VERSION_ID|BUILD_ID)=' profile/airootfs/etc/os-release

      - name: Build ISO
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source-date-epoch }}
          FISHING_ISO_VERSION: ${{ steps.version.outputs.iso-version }}
        run: |
          mkarchiso -v -w work -o out profile
          shopt -s nullglob
          isos=(out/fishing-os-*.iso)
          if [[ ${#isos[@]} -ne 1 ]]; then
            echo "::error::Diharapkan tepat 1 ISO, ditemukan ${#isos[@]}"
            exit 1
          fi
          size="$(stat -c%s "${isos[0]}")"
          # GitHub Releases menolak berkas >= 2 GiB (2048 MiB); sisakan margin.
          max=$((2000 * 1024 * 1024))
          echo "ISO: ${isos[0]} ($((size / 1024 / 1024)) MiB, batas $((max / 1024 / 1024)) MiB)"
          echo "--- 25 paket terbesar (ukuran terpasang) ---"
          pacman --dbpath work/x86_64/airootfs/var/lib/pacman -Qi \
            | awk '/^Name/ {n=$3} /^Installed Size/ {v=$4; if ($5=="KiB") v/=1024; else if ($5=="GiB") v*=1024; printf "%8.1f MiB  %s\n", v, n}' \
            | sort -rn | sed -n 1,25p
          echo "--- ukuran komponen ISO (MiB) ---"
          du -sm work/iso/arch/x86_64/airootfs.sfs work/iso/arch/boot/x86_64/initramfs-linux.img work/x86_64/airootfs/usr/lib/firmware || true
          du -sm work/x86_64/airootfs/usr/lib/firmware/* | sort -rn | sed -n 1,10p || true
          if (( size > max )); then
            echo "::error::ISO melebihi batas 2000 MiB (batas berkas GitHub Releases 2 GiB)"
            exit 1
          fi
          rm -rf work
          (cd out && sha256sum -- fishing-os-*.iso > sha256sums.txt && cat sha256sums.txt)

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: fishing-os-iso
          path: |
            out/*.iso
            out/sha256sums.txt
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM (jika tersedia di runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "KVM tidak tersedia: tes memakai emulasi (lambat)"

      - name: Install QEMU dan xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: fishing-os-iso
          path: out/

      - name: Run smoke test
        run: bash tests/test_iso.sh out/fishing-os-*.iso

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            test-output.log
            qemu-serial.log
            qemu-stderr.log
          retention-days: 7
          if-no-files-found: ignore

---
name: CI Fishing OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archiso qemu-base expect git dosfstools mtools \
            squashfs-tools gnupg

      - name: Determine ISO version and build mode
        id: version
        run: |
          COMMIT_DATE="$(date +%s)"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v([0-9]{4})\.([0-9]{2})\.([0-9]+)$ ]]; then
            echo "SOURCE_DATE_EPOCH=$COMMIT_DATE" >> "$GITHUB_OUTPUT"
            ISO_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "SOURCE_DATE_EPOCH=$COMMIT_DATE" >> "$GITHUB_OUTPUT"
            ISO_VERSION="$(date -d "@$COMMIT_DATE" +%Y.%m).0"
          fi
          echo "ISO_VERSION=$ISO_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "BUILD_MODE=release" >> "$GITHUB_OUTPUT"
          else
            echo "BUILD_MODE=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ISO
        id: build
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.SOURCE_DATE_EPOCH }}
        run: |
          mkarchiso -v \
            -w work \
            -o out \
            profile
          ISO_PATH="$(ls out/*.iso | head -n1)"
          ISO_SIZE="$(stat -c%s "$ISO_PATH")"
          MAX_SIZE=$((4700 * 1024 * 1024))  # 4.7 GiB
          echo "ISO_PATH=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "ISO_SIZE=$ISO_SIZE" >> "$GITHUB_OUTPUT"
          echo "ISO_VERSION=${{ steps.version.outputs.ISO_VERSION }}" >> "$GITHUB_OUTPUT"
          if [[ "$ISO_SIZE" -gt "$MAX_SIZE" ]]; then
            echo "ERROR: ISO size $ISO_SIZE bytes exceeds 4.7 GiB limit" >&2
            exit 1
          fi
          ls -lh out/

      - name: Generate checksums
        run: |
          cd out
          sha256sum fishing-os*.iso > sha256sums.txt
          cat sha256sums.txt

      - name: Upload PR artifacts
        if: steps.version.outputs.BUILD_MODE == 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: fishing-os-iso-pr
          path: |
            out/*.iso
            out/sha256sums.txt
          retention-days: 14

      - name: Upload release artifacts
        if: steps.version.outputs.BUILD_MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: fishing-os-release
          path: |
            out/*.iso
            out/sha256sums.txt
          retention-days: 90

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install QEMU for testing
        run: |
          pacman -Sy --noconfirm qemu-base expect

      - name: Download PR artifacts
        if: needs.build.outputs.BUILD_MODE == 'pr'
        uses: actions/download-artifact@v4
        with:
          name: fishing-os-iso-pr
          path: out/

      - name: Download release artifacts
        if: needs.build.outputs.BUILD_MODE == 'release'
        uses: actions/download-artifact@v4
        with:
          name: fishing-os-release
          path: out/

      - name: Run ISO tests
        run: |
          chmod +x tests/test_iso.sh tests/user_scenario.sh
          ./tests/test_iso.sh out/*.iso

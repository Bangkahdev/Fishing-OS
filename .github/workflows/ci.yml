name: CI Fishing OS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archiso qemu-base expect git dosfstools mtools \
            squashfs-tools gnupg

      - name: Determine ISO version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ ^v([0-9]{4})\.([0-9]{2})\.([0-9]+)$ ]]; then
            ISO_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            ISO_VERSION="$(date +%Y.%m).0"
          fi
          echo "ISO_VERSION=$ISO_VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_MODE=release" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "BUILD_MODE=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ISO
        id: build
        run: |
          SOURCE_DATE_EPOCH="$(date +%s)" mkarchiso -v -w work -o out profile
          ISO_PATH="$(ls out/*.iso | head -n1)"
          ISO_SIZE="$(stat -c%s "$ISO_PATH")"
          MAX_SIZE=$((4700 * 1024 * 1024))  # 4.7 GiB
          echo "ISO_PATH=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "ISO_SIZE=$ISO_SIZE" >> "$GITHUB_OUTPUT"
          echo "ISO_VERSION=${{ steps.version.outputs.ISO_VERSION }}" >> "$GITHUB_OUTPUT"
          if [[ "$ISO_SIZE" -gt "$MAX_SIZE" ]]; then
            echo "ERROR: ISO size $ISO_SIZE bytes exceeds 4.7 GiB limit" >&2
            exit 1
          fi
          ls -lh out/

      - name: Generate checksums
        run: |
          cd out
          sha256sum fishing-os*.iso > sha256sums.txt
          cat sha256sums.txt

      - name: Sign artefacts with CI key
        if: steps.version.outputs.BUILD_MODE == 'release' && env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          TMPDIR="$(mktemp -d)"
          export GNUPGHOME="$TMPDIR"
          chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import --passphrase "$GPG_PASSPHRASE"
          cd out
          GPG_USER="bangkah@mdhiyaulatha.me"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_USER" --detach-sign fishing-os*.iso
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_USER" --detach-sign sha256sums.txt
          gpg --batch --export-ownertrust > ownertrust.txt
          gpg --armor --export "$GPG_USER" > ci-key.asc
          gpg --armor --fingerprint "$GPG_USER" > ci-key-fingerprint.txt
          echo "=== Fingerprint ==="
          cat ci-key-fingerprint.txt
          rm -rf "$GNUPGHOME"

      - name: Upload PR artifacts
        if: steps.version.outputs.BUILD_MODE == 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: fishing-os-iso-pr
          path: |
            out/*.iso
            out/sha256sums.txt
          retention-days: 14

      - name: Upload release artifacts
        if: steps.version.outputs.BUILD_MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: fishing-os-release
          path: |
            out/*.iso
            out/*.iso.sig
            out/sha256sums.txt
            out/sha256sums.txt.sig
            out/ci-key-fingerprint.txt
          retention-days: 90

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.iso.sig
            out/sha256sums.txt
            out/sha256sums.txt.sig
            out/ci-key-fingerprint.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

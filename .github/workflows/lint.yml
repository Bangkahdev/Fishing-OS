---
name: Lint Fishing OS

on:
  # Reusable: dipanggil oleh ci.yml (push/PR ke main) dan release.yml (tag).
  # Satu-satunya sumber kebenaran lint, jadi tidak ada run ganda.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pacman -Syu --noconfirm shellcheck yamllint findutils gnupg

      - name: Shellcheck
        run: |
          shellcheck -S warning \
            tests/test_iso.sh \
            tests/check_bootmenu.sh \
            profile/profiledef.sh \
            profile/airootfs/usr/local/bin/fishing-*

      - name: Check boot menu defaults
        run: bash tests/check_bootmenu.sh

      - name: Check systemd .wants entries are symlinks
        run: |
          bad="$(find profile/airootfs -type f -path '*.wants/*')"
          if [[ -n "$bad" ]]; then
            echo "::error::Entri .wants harus symlink, bukan berkas biasa (unit tidak akan aktif):"
            echo "$bad"
            exit 1
          fi
          echo "[PASS] Semua entri .wants adalah symlink"

      - name: Yamllint
        run: yamllint -c .yamllint .github/

      - name: Check for zero-byte files
        run: |
          empty="$(find . -type f -empty -not -path './.git/*')"
          if [[ -n "$empty" ]]; then
            echo "::error::Berkas kosong (0 byte) ditemukan:"
            echo "$empty"
            exit 1
          fi
          echo "[PASS] Tidak ada berkas kosong"

      - name: Check boot menu branding (no "Arch Linux")
        run: |
          if grep -ril "arch linux" profile/syslinux/ profile/grub/ profile/efiboot/ 2>/dev/null; then
            echo "::error::Teks 'Arch Linux' masih ada di berkas menu boot"
            exit 1
          fi
          echo "[PASS] Tidak ada branding Arch Linux di menu boot"

      - name: Check packages exist in Arch repos
        run: |
          missing=0
          while IFS= read -r line; do
            pkg="$(echo "${line%%#*}" | xargs)"
            [[ -z "$pkg" ]] && continue
            if ! pacman -Sp -- "$pkg" >/dev/null 2>&1; then
              echo "::error::Paket tidak ditemukan di repositori Arch: $pkg"
              missing=$((missing + 1))
            fi
          done < profile/packages.x86_64
          if (( missing > 0 )); then
            echo "$missing paket tidak ditemukan"
            exit 1
          fi
          echo "[PASS] Semua paket ada di repositori Arch"

      - name: Actionlint (validasi schema workflow)
        run: |
          set -euo pipefail
          version="1.7.12"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          expected="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL -o actionlint.tgz "$url"
          echo "${expected}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color .github/workflows/*.yml
          echo "[PASS] actionlint: tidak ada temuan"

      - name: Check CI public key fingerprint
        run: |
          expected="69aa973a33a3930bb1c83850f713bcd7d6e8f591"
          actual="$(gpg --batch --show-keys --with-colons ci-key.asc 2>/dev/null \
            | awk -F: '/^fpr:/ {print tolower($10); exit}')"
          if [[ -z "$actual" ]]; then
            echo "::error::ci-key.asc tidak bisa dibaca atau bukan kunci publik"
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Fingerprint ci-key.asc ($actual) tidak cocok dengan fingerprint CI key ($expected)"
            exit 1
          fi
          if grep -q 'PRIVATE KEY' ci-key.asc; then
            echo "::error::ci-key.asc memuat private key; jangan pernah commit private key"
            exit 1
          fi
          echo "[PASS] Fingerprint ci-key.asc cocok ($actual)"

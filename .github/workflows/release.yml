---
name: Release Fishing OS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 90

  sign:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    environment: release
    defaults:
      run:
        shell: bash

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: fishing-os-iso
          path: out/

      - name: Install dependencies
        run: pacman -Syu --noconfirm gnupg

      - name: Sign artefacts with CI key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          EXPECTED_FPR: ${{ vars.GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          GPG_USER="bangkah@mdhiyaulatha.me"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          PASSFILE="$GNUPGHOME/passphrase"
          printf '%s' "$GPG_PASSPHRASE" > "$PASSFILE"
          chmod 600 "$PASSFILE"

          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback \
            --passphrase-file "$PASSFILE" --import

          FPR="$(gpg --batch --with-colons --fingerprint "$GPG_USER" | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "Fingerprint kunci: $FPR"
          if [[ -n "${EXPECTED_FPR:-}" && "$FPR" != "$EXPECTED_FPR" ]]; then
            echo "::error::Fingerprint kunci ($FPR) tidak sama dengan vars.GPG_FINGERPRINT"
            exit 1
          fi

          cd out
          shopt -s nullglob
          isos=(fishing-os-*.iso)
          if [[ ${#isos[@]} -ne 1 ]]; then
            echo "::error::Diharapkan tepat 1 ISO, ditemukan ${#isos[@]}"
            exit 1
          fi
          iso="${isos[0]}"

          sha256sum -c sha256sums.txt
          for f in "$iso" sha256sums.txt; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PASSFILE" \
              --local-user "$GPG_USER" --detach-sign -- "$f"
            gpg --batch --verify -- "$f.sig" "$f"
          done
          gpg --armor --fingerprint "$GPG_USER" > ci-key-fingerprint.txt
          cat ci-key-fingerprint.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fishing-os-release-signed
          path: |
            out/*.iso
            out/*.iso.sig
            out/sha256sums.txt
            out/sha256sums.txt.sig
            out/ci-key-fingerprint.txt
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

  mirror:
    needs: sign
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    environment: release
    defaults:
      run:
        shell: bash
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
      base-url: ${{ steps.cfg.outputs.base-url }}

    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: fishing-os-release-signed
          path: out/

      - name: Check Cloudflare R2 configuration
        id: cfg
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_ACCESS_KEY_ID}" ||
                -z "${R2_SECRET_ACCESS_KEY}" || -z "${R2_BUCKET}" ||
                -z "${R2_PUBLIC_BASE_URL}" ]]; then
            echo "::warning::Mirror R2 dilewati: secrets/vars R2 belum lengkap"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "base-url=${R2_PUBLIC_BASE_URL%/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install rclone
        if: steps.cfg.outputs.enabled == 'true'
        run: pacman -Syu --noconfirm rclone

      - name: Upload release files and mirror manifest to Cloudflare R2
        if: steps.cfg.outputs.enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ steps.cfg.outputs.base-url }}
          TAG: ${{ github.ref_name }}
          # Token Object Read & Write tidak bisa melihat daftar bucket.
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
        run: |
          set -euo pipefail
          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          dest="r2:${R2_BUCKET}/releases/${TAG}"
          base="${R2_PUBLIC_BASE_URL}/releases/${TAG}"
          rclone copy out/ "${dest}/" \
            --include "fishing-os-*.iso" \
            --include "*.sig" \
            --include "sha256sums.txt" \
            --include "ci-key-fingerprint.txt" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"

          {
            echo "base_url=${base}"
            for f in out/*.iso out/*.iso.sig out/sha256sums.txt \
              out/sha256sums.txt.sig out/ci-key-fingerprint.txt; do
              printf '%s  %s/%s\n' "$(basename "$f")" "${base}" "$(basename "$f")"
            done
          } > out/mirrors.txt
          rclone copyto out/mirrors.txt "${dest}/mirrors.txt" \
            --header-upload "Cache-Control: public, max-age=300"

          rclone ls "${dest}" | sort
          cat out/mirrors.txt

  release:
    needs: [sign, mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: fishing-os-release-signed
          path: out/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso.sig
            out/sha256sums.txt
            out/sha256sums.txt.sig
            out/ci-key-fingerprint.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO to GitHub if it fits the 2 GiB asset limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          iso="$(ls out/*.iso)"
          size="$(stat -c%s "$iso")"
          if (( size >= 2000 * 1024 * 1024 )); then
            echo "::warning::ISO $((size / 1024 / 1024)) MiB melebihi batas aset GitHub; ISO hanya tersedia di mirror R2"
            exit 0
          fi
          gh release upload "$TAG" "$iso" --clobber

      - name: Append Cloudflare R2 mirror links to release notes
        if: needs.mirror.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MIRROR_BASE: ${{ needs.mirror.outputs.base-url }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > notes.md
          {
            printf '\n\n### Mirror (Cloudflare R2)\n\n'
            for f in out/*.iso out/*.iso.sig out/sha256sums.txt \
              out/sha256sums.txt.sig out/ci-key-fingerprint.txt; do
              printf -- '- `%s`: %s/releases/%s/%s\n' \
                "$(basename "$f")" "$MIRROR_BASE" "$TAG" "$(basename "$f")"
            done
            printf '\nVerifikasi: `curl -fsSLO %s/releases/%s/sha256sums.txt`' \
              "$MIRROR_BASE" "$TAG"
            printf ' lalu `sha256sum -c sha256sums.txt`.\n'
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
